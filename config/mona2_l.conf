#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y

# Keyboard status is advertised by the right central, including left battery.
# Modifier-state events only exist on the central in this ZMK baseline.
CONFIG_ZMK_KEYBOARD_NAME="moNa2"
CONFIG_ZMK_STATUS_ADVERTISEMENT=n

# BLE peripheral has no USB HID endpoint.
CONFIG_ZMK_USB=n
